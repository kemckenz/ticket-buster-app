apply plugin: 'com.android.application'

android {
    namespace 'com.kmac.ticketbuster'
    compileSdk 34

    defaultConfig {
        applicationId "com.kmac.ticketbuster"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Debug build is what the CI workflow produces — no signing
            // config needed, Fire TV's Downloader app installs it directly.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
